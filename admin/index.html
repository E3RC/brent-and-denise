<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Editor — Brent &amp; Denise</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Authoring UI for Brent &amp; Denise. Sign-in required. Not indexed by search engines.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .admin-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--space-12) var(--space-4);
      text-align: center;
    }
    .admin-shell h1 {
      font-family: var(--font-heading);
      margin-bottom: var(--space-2);
    }
    .admin-shell p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-4);
    }
    [data-theme="dark"] { background-color: var(--color-bg, #0f1015); }
  </style>
  <!--
    Netlify Identity widget: required for Decap's git-gateway backend.
    Loaded synchronously from <head> so that window.netlifyIdentity is
    registered before any body-script runs. The init() call itself lives
    in <body> just below — running it in <head> risks the widget referencing
    DOM nodes that don't exist yet, after which Decap reinitialises with
    a wrong relative URL.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <noscript>
    <div class="admin-shell">
      <h1>Editor unavailable</h1>
      <p>This page needs JavaScript enabled to run the content editor.</p>
    </div>
  </noscript>
  <!--
    Initialise the Netlify Identity widget AFTER <body> exists. Without
    this call the widget guesses APIUrl from window.location and Decap
    reinitialises it with the wrong host. Required path segment: end in
    /.netlify/identity — the widget appends /site, /user, /token to this
    base URL. To rename the underlying Netlify site, change the host (Site
    settings → Site details → Change site name) and keep the path intact.
  -->
  <script>
    window.netlifyIdentity.init({
      APIUrl: 'https://brentndenisecom.netlify.app/.netlify/identity',
      logo: false
    });
  </script>
  <!--
    Decap CMS script. Loads /admin/config.yml on this same path and renders
    the editor UI. If unauthenticated it opens the git-gateway login flow.
  -->
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
</body>
</html>
