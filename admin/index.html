<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Editor — Brent &amp; Denise</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Authoring UI for Brent &amp; Denise. Sign-in required. Not indexed by search engines.">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .admin-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--space-12) var(--space-4);
      text-align: center;
    }
    .admin-shell h1 {
      font-family: var(--font-heading);
      margin-bottom: var(--space-2);
    }
    .admin-shell p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-4);
    }
    [data-theme="dark"] { background-color: var(--color-bg, #0f1015); }
  </style>
</head>
<body>
  <noscript>
    <div class="admin-shell">
      <h1>Editor unavailable</h1>
      <p>This page needs JavaScript enabled to run the content editor.</p>
    </div>
  </noscript>
  <!--
    Decap loads the cross-domain Identity and Git Gateway endpoints from
    /admin/config.yml and renders its built-in login form.
  -->
  <script>
    const postEditorHash = '#/collections/posts/entries/posts-data';
    if (!window.location.hash || ['#/', '#/workflow'].includes(window.location.hash)) {
      window.location.replace(`${window.location.pathname}${window.location.search}${postEditorHash}`);
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
</body>
</html>
