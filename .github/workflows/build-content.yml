name: Build content

# The Decap CMS only writes assets/data/posts.json. Everything else derived from
# it (post/<slug>/ pages, feed.xml, sitemap.xml) is generated by scripts and must
# land in the same commit history for Cloudflare Pages to deploy it. This runs on
# every push to main, so publishing in /admin/ is enough; no local terminal step.
#
# A commit pushed with GITHUB_TOKEN does not start another workflow run, so this
# cannot loop. The generous guard is still worth keeping: regeneration is
# deterministic, and a second run with nothing to do simply exits.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate post pages, feed, and sitemap
        run: node scripts/build-content.mjs

      - name: Commit generated files when they changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate post pages, feed, and sitemap"
          git push
