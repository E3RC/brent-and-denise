<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found &mdash; Brent &amp; Denise</title>
  <meta name="description" content="That page does not exist. Head back to the home page for Brent and Denise's retirement blog.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <script>
    (function () {
      var saved = (document.cookie.match(/(^| )theme=([^;]+)/) || [])[2];
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .not-found {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--space-16) var(--space-4);
    }

    .not-found h1 {
      margin-bottom: var(--space-3);
    }

    .not-found p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-6);
    }

    .not-found nav {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-8);
    }

    .not-found nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: var(--space-1) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: color 150ms ease, border-color 150ms ease;
    }

    .not-found nav a:hover {
      color: var(--color-text);
      border-color: var(--color-accent);
    }
  </style>
</head>
<body>
  <main class="not-found">
    <h1>Page not found</h1>
    <p>That page does not exist. Everything lives on the home page, so pick a section:</p>
    <nav aria-label="Site sections">
      <a href="/#home">Home</a>
      <a href="/#about">About</a>
      <a href="/#blog">Blog</a>
      <a href="/#contact">Contact</a>
      <a href="/#resources">Resources</a>
    </nav>
    <a href="/#home" class="cta-link">Back to the home page</a>
  </main>
</body>
</html>
